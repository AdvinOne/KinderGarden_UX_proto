</section></main><script>
const stage=document.querySelector(".stage"),answers=[...document.querySelectorAll(".answer")],correct=document.querySelector(".correct"),wrong=document.querySelector(".wrong"),speaker=document.querySelector(".speaker"),textBtn=document.querySelector(".text-btn"),panel=document.querySelector(".instruction"),audio=document.querySelector(".audio");let solved=false,locked=false;
function stop(){audio.pause();audio.currentTime=0}function play(){if(solved)return;audio.currentTime=0;audio.play().catch(()=>speaker.classList.remove("is-playing"))}
audio.addEventListener("play",()=>speaker.classList.add("is-playing"));audio.addEventListener("pause",()=>speaker.classList.remove("is-playing"));audio.addEventListener("ended",()=>speaker.classList.remove("is-playing"));speaker.addEventListener("click",play);
textBtn.addEventListener("click",()=>{const open=panel.hidden;panel.hidden=!open;textBtn.setAttribute("aria-expanded",String(open))});
wrong.addEventListener("click",()=>{if(locked||solved)return;locked=true;wrong.classList.add("is-feedback");wrong.disabled=true;setTimeout(()=>{wrong.classList.remove("is-feedback");wrong.disabled=false;locked=false},650)});
correct.addEventListener("click",()=>{if(locked||solved)return;solved=true;locked=true;stop();correct.classList.add("is-feedback");answers.forEach(a=>a.disabled=true);setTimeout(()=>stage.classList.add("is-final"),800)});
setTimeout(play,2000);
</script></body></html>
