<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 1</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="prototype-page">
    <section class="prototype-stage" aria-label="Задание 1">
      <img class="screen task-screen" src="./assets/task1.svg" alt="" draggable="false">
      <img class="screen success-screen" src="./assets/task1-success.svg" alt="Задание выполнено верно" draggable="false">

      <button class="answer answer-correct" type="button" aria-label="Выбрать первый домик">
        <img src="./assets/task1-answer-correct.svg" alt="" draggable="false">
      </button>
      <button class="answer answer-wrong" type="button" aria-label="Выбрать второй домик">
        <img src="./assets/task1-answer-wrong.svg" alt="" draggable="false">
      </button>
      <button class="control speaker-button" type="button" aria-label="Прослушать задание">
        <img class="speaker-default" src="./assets/speaker-default.svg" alt="" draggable="false">
        <img class="speaker-playing" src="./assets/speaker-playing.svg" alt="" draggable="false">
      </button>
      <button class="control text-button" type="button" aria-label="Показать текст задания" aria-expanded="false">
        <img src="./assets/text-icon.svg" alt="" draggable="false">
      </button>

      <div class="instruction-text" role="dialog" aria-label="Текст задания" hidden>
        <img src="./assets/task1-text.svg" alt="Текст задания">
      </div>

      <audio class="instruction-audio" src="./assets/task1-instruction.mp3" preload="auto"></audio>
      <audio class="success-audio" src="./assets/task1-success.mp3" preload="auto"></audio>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
