<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 2</title>
  <link rel="stylesheet" href="./task2.css">
</head>
<body>
  <main class="prototype-page">
    <section class="prototype-stage" aria-label="Задание 2">
      <img class="screen task-screen" src="./assets/task2.png" alt="" draggable="false">
      <img class="screen success-screen" src="./assets/task2-success.svg" alt="Задание выполнено верно" draggable="false">

      <button class="answer answer-wrong answer-inside" type="button" aria-label="Выбрать мяч внутри будки">
        <img class="answer-default" src="./assets/task2-answer-wrong.svg" alt="" draggable="false">
        <img class="answer-feedback" src="./assets/task2-answer-wrong-success.svg" alt="" draggable="false">
      </button>
      <button class="answer answer-correct answer-outside" type="button" aria-label="Выбрать мяч снаружи будки">
        <img class="answer-default" src="./assets/task2-answer-correct.svg" alt="" draggable="false">
        <img class="answer-feedback" src="./assets/task2-answer-correct-success.svg" alt="" draggable="false">
      </button>

      <button class="control speaker-button" type="button" aria-label="Прослушать задание">
        <img class="speaker-default" src="./assets/speaker-default.svg" alt="" draggable="false">
        <img class="speaker-playing" src="./assets/speaker-playing.svg" alt="" draggable="false">
      </button>
      <button class="control text-button" type="button" aria-label="Показать текст задания" aria-expanded="false">
        <img src="./assets/text-icon.svg" alt="" draggable="false">
      </button>

      <div class="instruction-text" role="dialog" aria-label="Текст задания" hidden>
        <img src="./assets/task2-text.svg" alt="Текст задания">
      </div>

      <audio class="instruction-audio" src="./assets/task2-instruction.mp3" preload="auto"></audio>
      <audio class="success-audio" src="./assets/task2-success.mp3" preload="auto"></audio>
    </section>
  </main>
  <script src="./task2.js"></script>
</body>
</html>
